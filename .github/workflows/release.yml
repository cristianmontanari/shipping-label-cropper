name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Run automated tests
        run: python test_shipping_label_cropper.py

      - name: Build Windows standalone executable
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name ShippingLabelCropper `
            --icon assets/icon.ico `
            --add-data "assets/icon.ico;assets" `
            --add-data "assets/icon.png;assets" `
            main.py

      - name: Prepare Windows release asset and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exePath = "release/ShippingLabelCropper-windows-x64.exe"
          Copy-Item "dist/ShippingLabelCropper.exe" $exePath
          $hash = (Get-FileHash -Algorithm SHA256 $exePath).Hash.ToLower()
          "$hash  ShippingLabelCropper-windows-x64.exe" | Out-File -Encoding ascii "release/ShippingLabelCropper-windows-x64.exe.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: release/*

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Run automated tests
        run: python test_shipping_label_cropper.py

      - name: Generate macOS .icns icon
        run: |
          mkdir -p build_icons/icon.iconset
          sips -z 16 16     assets/icon.png --out build_icons/icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out build_icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out build_icons/icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out build_icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out build_icons/icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out build_icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out build_icons/icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out build_icons/icon.iconset/icon_256x256@2x.png
          iconutil -c icns build_icons/icon.iconset -o build_icons/icon.icns

      - name: Build macOS .app bundle
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "Shipping Label Cropper" \
            --icon build_icons/icon.icns \
            --osx-bundle-identifier "com.cristianmontanari.shipping-label-cropper" \
            --add-data "assets/icon.ico:assets" \
            --add-data "assets/icon.png:assets" \
            main.py
          codesign --force --deep --sign - "dist/Shipping Label Cropper.app"

      - name: Package .dmg and SHA-256
        run: |
          mkdir -p dmg_stage release
          cp -R "dist/Shipping Label Cropper.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          DMG_NAME="ShippingLabelCropper-macos-${{ matrix.arch }}.dmg"
          hdiutil create \
            -volname "Shipping Label Cropper" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            "release/${DMG_NAME}"
          (cd release && shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256")

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/*

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system Tk, Xvfb, and binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk tk-dev binutils

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Run automated tests
        run: xvfb-run -a python test_shipping_label_cropper.py

      - name: Build Linux standalone executable
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name ShippingLabelCropper \
            --add-data "assets/icon.ico:assets" \
            --add-data "assets/icon.png:assets" \
            main.py

      - name: Package .tar.gz and SHA-256
        run: |
          mkdir -p linux_pkg release
          cp dist/ShippingLabelCropper linux_pkg/ShippingLabelCropper
          chmod +x linux_pkg/ShippingLabelCropper
          cp LICENSE linux_pkg/LICENSE
          TAR_NAME="ShippingLabelCropper-linux-x64.tar.gz"
          tar -czf "release/${TAR_NAME}" -C linux_pkg ShippingLabelCropper LICENSE
          (cd release && sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256")

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-linux-x64
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
